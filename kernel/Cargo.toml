[package]
name = "kernel"
version = "0.1.0"
edition = "2024"

[dependencies]
bootloader_api = "0.11.17"
x86_64 = "0.15.5"
spin = "0.9.8"
pic8259 = "0.11.0"
pc-keyboard = "0.7.0"
smoltcp = { version = "0.14.0", default-features = false, features = [
    "alloc",
    "medium-ethernet",
    "proto-ipv4",
    "socket-udp",
    "socket-tcp",
    "socket-icmp",
    "socket-dns",
] }

[build-dependencies]
http-get = { path = "../user/http-get", artifact = "bin", target = "x86_64-unknown-none" }
udp-test = { path = "../user/udp-test", artifact = "bin", target = "x86_64-unknown-none" }
ping = { path = "../user/ping", artifact = "bin", target = "x86_64-unknown-none" }
